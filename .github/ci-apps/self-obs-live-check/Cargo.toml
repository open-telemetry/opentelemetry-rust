[package]
name = "self-obs-live-check"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75.0"
publish = false
autobenches = false

# Purpose-built example for the sdk-self-observability CI workflow.
# Exercises otel.sdk.processor.log.processed by creating a LoggerProvider
# with a BatchLogProcessor, emitting logs, and shutting down.
# Not intended as user-facing documentation.

[[bin]]
name = "self-obs-live-check"
path = "src/main.rs"
bench = false

[dependencies]
opentelemetry = { workspace = true, features = ["logs", "trace"] }
opentelemetry_sdk = { workspace = true, features = ["logs", "trace", "metrics", "experimental_metrics_bound_instruments", "testing"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "metrics"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
