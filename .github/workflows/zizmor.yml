name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '28 21 * * 2' # weekly at 21:28 UTC on Tuesday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@ee32c419ea90b05286c0cdc24538d970992cf82a # v0.11.0
