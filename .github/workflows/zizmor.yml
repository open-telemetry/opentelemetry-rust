name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '28 21 * * 2' # weekly at 21:28 UTC on Tuesday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@22c6d43ead71f463aa2b16ddb7081e94d2ad6a0e # v0.26.0
