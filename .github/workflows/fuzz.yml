# Run coverage-guided fuzzing for pull requests carrying the "fuzz" label and
# for every push to main. The label-gated PR trigger follows benchmark.yml: a
# newly applied label starts the workflow, and later synchronizations rerun it
# while the label remains present.
name: fuzz

on:
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contextFuzz:
    name: context fuzzing
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'fuzz')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rust-src, rustfmt, clippy
          targets: x86_64-unknown-linux-gnu

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-fuzz

      - name: Validate fuzz project
        run: |
          cargo +nightly fmt --manifest-path opentelemetry/fuzz/Cargo.toml -- --check
          cargo +nightly test --manifest-path opentelemetry/fuzz/Cargo.toml --lib
          cargo +nightly clippy --manifest-path opentelemetry/fuzz/Cargo.toml --all-targets -- -D warnings
          cargo +nightly fuzz build --fuzz-dir opentelemetry/fuzz --target x86_64-unknown-linux-gnu

      - name: Run context fuzz targets
        run: |
          for target in $(cargo +nightly fuzz list --fuzz-dir opentelemetry/fuzz); do
            cargo +nightly fuzz run --fuzz-dir opentelemetry/fuzz "$target" \
              --target x86_64-unknown-linux-gnu -- \
              -max_total_time=60 -timeout=10 -max_len=4096
          done
