[package]
name = "opentelemetry-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
opentelemetry = { path = "..", default-features = false, features = ["trace"] }

# Keep this nightly-only harness independent from the stable root workspace.
[workspace]
members = ["."]

[profile.release]
debug = "line-tables-only"
