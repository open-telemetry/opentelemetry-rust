[package]
name = "opentelemetry-otlp-file"
version = "0.33.1"
description = "OpenTelemetry Protocol File Exporter: writes OTLP JSON Lines to stdout or a file"
homepage = "https://github.com/open-telemetry/opentelemetry-rust/tree/main/opentelemetry-otlp-file"
repository = "https://github.com/open-telemetry/opentelemetry-rust/tree/main/opentelemetry-otlp-file"
readme = "README.md"
categories = [
    "development-tools::debugging",
    "development-tools::profiling",
]
keywords = ["opentelemetry", "otlp", "logging", "tracing", "metrics"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.75.0"
autobenches = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
opentelemetry = { workspace = true, default-features = false }
opentelemetry_sdk = { workspace = true, default-features = false }
opentelemetry-proto = { workspace = true, default-features = false, features = ["gen-tonic-messages", "with-serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
futures-executor = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["registry", "std"] }

[features]
default = ["trace", "metrics", "logs", "internal-logs"]
trace = ["opentelemetry/trace", "opentelemetry_sdk/trace", "opentelemetry-proto/trace"]
metrics = ["opentelemetry/metrics", "opentelemetry_sdk/metrics", "opentelemetry-proto/metrics"]
logs = ["opentelemetry/logs", "opentelemetry_sdk/logs", "opentelemetry-proto/logs"]
internal-logs = ["opentelemetry/internal-logs", "opentelemetry_sdk/internal-logs"]

[[example]]
name = "basic"
required-features = ["trace", "metrics", "logs"]

[lints]
workspace = true

[lib]
bench = false
